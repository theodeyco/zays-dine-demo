<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Zay&rsquo;s Dine</title>
    <link rel="stylesheet" href="style.css">
    <script>
        try {
            if (sessionStorage.getItem("steam")) {
                document.documentElement.classList.add("steam-arrive");
            }
        } catch (error) { }
    </script>
</head>

<body>
    <div class="curtain" id="curtain" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
    </div>
    <header class="nav">
        <a class="nav-brand" href="index.html">Zay&rsquo;s Dine</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html" class="active">Menu</a>
            <a href="index.html#contact">Reserve</a>
        </nav>
    </header>

    <div class="hero hero-small">
        <h1>Our Menu</h1>
        <p>Cafe and Brunch</p>
    </div>

    <div class="menu-page">
        <h2>Choose a category</h2>
        <div class="pole"></div>
        <div class="menu-tabs" id="menu-tabs" role="tablist"></div>
        <div class="menu-chips" id="menu-chips"></div>
        <p class="menu-count" id="menu-count" aria-live="polite"></p>
        <div class="menu-grid" id="menu-grid"></div>
        <p class="menu-note">Sample menu for a demo. For a real restaurant, ingredients and dietary labels must be
            confirmed by the kitchen.</p>
    </div>
    <button class="cup-fab" id="cup-fab" type="button" aria-label="Back to top">
        <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
                <clipPath id="cup-clip">
                    <path d="M14 26h32v14a12 12 0 0 1-12 12h-8A12 12 0 0 1 14 40V26z" />
                </clipPath>
            </defs>
            <rect class="cup-liquid" x="10" y="26" width="40" height="28" clip-path="url(#cup-clip)" />
            <path d="M14 26h32v14a12 12 0 0 1-12 12h-8A12 12 0 0 1 14 40V26z" />
            <path d="M46 30h4a6 6 0 0 1 0 12h-4" />
            <path d="M8 56h44" />
        </svg>
    </button>

    <button class="chat-toggle" id="chat-toggle" type="button" aria-label="Open chat" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 21 12z" />
        </svg>
    </button>

    <div class="chat" id="chat" role="dialog" aria-label="Chat with the restaurant" aria-hidden="true">
        <div class="chat-head">
            <div>
                <strong>Zay&rsquo;s Dine</strong>
                <span>Virtual assistant</span>
            </div>
            <div class="chat-tools">
                <button class="chat-sound" id="chat-sound" type="button" aria-pressed="true">Sound on</button>
                <button class="chat-close" id="chat-close" type="button" aria-label="Close chat">&times;</button>
            </div>
        </div>

        <div class="chat-log" id="chat-log"></div>
        <div class="chat-chips" id="chat-chips"></div>

        <form class="chat-input" id="chat-form">
            <input type="text" id="chat-text" placeholder="Type a question..." autocomplete="off" maxlength="200">
            <button type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 12l16-8-6 16-3-7-7-1z" />
                </svg>
            </button>
        </form>
    </div>

    <script src="data.js"></script>
    <script src="chat.js"></script>
    <script src="common.js"></script>
    <script>

        const tabs = document.getElementById("menu-tabs");
        const chipsBox = document.getElementById("menu-chips");
        const grid = document.getElementById("menu-grid");
        const count = document.getElementById("menu-count");

        const categories = Array.from(new Set(MENU.map(function (d) { return d.category; })));

        const FILTERS = [
            { key: "vegetarian", label: "Vegetarian" },
            { key: "spicy", label: "Spicy" },
            { key: "hot", label: "Served hot" }
        ];

        let activeCategory = categories[0];
        const counted = new Set();
        const activeFilters = new Set();

        function money(n) {
            return "$" + n.toFixed(2);
        }

        function toggleFlip(card) {
            const flipped = card.classList.toggle("flipped");
            card.setAttribute("aria-pressed", String(flipped));
        }

        function buildDish(d, index) {
            const card = document.createElement("article");
            card.className = "dish" + (d.hot ? " is-hot" : "");
            card.style.animationDelay = index * 0.07 + "s";
            card.tabIndex = 0;
            card.setAttribute("role", "button");
            card.setAttribute("aria-pressed", "false");
            card.setAttribute("aria-label", d.name + ". Press to see ingredients.");

            const tilt = document.createElement("div");
            tilt.className = "dish-tilt";

            const inner = document.createElement("div");
            inner.className = "dish-inner";

            /* front */
            const front = document.createElement("div");
            front.className = "dish-face dish-front";

            const name = document.createElement("h3");
            name.textContent = d.name;

            const desc = document.createElement("p");
            desc.textContent = d.desc;

            const price = document.createElement("span");
            price.className = "dish-price";
            price.textContent = money(d.price);
            if (!counted.has(d.name)) { counted.add(d.name); price.dataset.count = d.price; }

            const hint = document.createElement("span");
            hint.className = "dish-hint";
            hint.textContent = "Tap to see ingredients";

            front.append(name, desc, price, hint);

            if (d.hot) {
                const hot = document.createElement("div");
                hot.className = "dish-hot";
                hot.setAttribute("aria-hidden", "true");
                hot.innerHTML =
                    '<div class="dish-steam"><span></span><span></span><span></span></div>' +
                    '<svg viewBox="0 0 64 64"><path d="M14 26h32v14a12 12 0 0 1-12 12h-8A12 12 0 0 1 14 40V26z"/><path d="M46 30h4a6 6 0 0 1 0 12h-4"/><path d="M8 56h44"/></svg>';
                front.appendChild(hot);
            }

            /* back */
            const back = document.createElement("div");
            back.className = "dish-face dish-back";

            const label = document.createElement("span");
            label.className = "dish-label";
            label.textContent = "Ingredients";

            const backName = document.createElement("h3");
            backName.textContent = d.name;

            const details = document.createElement("p");
            details.textContent = d.details;

            const backHint = document.createElement("span");
            backHint.className = "dish-hint";
            backHint.textContent = d.tags.length ? d.tags.join(" \u00b7 ") + " \u2022 Tap to flip back" : "Tap to flip back";

            back.append(label, backName, details, backHint);

            inner.append(front, back);
            tilt.appendChild(inner);
            card.appendChild(tilt);

            /* flip */
            card.addEventListener("click", function () {
                toggleFlip(card);
            });

            card.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleFlip(card);
                }
            });

            /* tilt (mouse only) */
            const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            card.addEventListener("pointermove", function (event) {
                if (calm || event.pointerType !== "mouse") return;

                const rect = card.getBoundingClientRect();
                const x = (event.clientX - rect.left) / rect.width - 0.5;
                const y = (event.clientY - rect.top) / rect.height - 0.5;

                card.style.setProperty("--ry", (x * 14).toFixed(1) + "deg");
                card.style.setProperty("--rx", (-y * 14).toFixed(1) + "deg");
            });

            card.addEventListener("pointerleave", function () {
                card.style.setProperty("--rx", "0deg");
                card.style.setProperty("--ry", "0deg");
            });

            return card;
        }

        function matches(d) {
            if (d.category !== activeCategory) return false;

            return Array.from(activeFilters).every(function (key) {
                return key === "hot" ? d.hot : d.tags.includes(key);
            });
        }

        function renderMenu() {
            grid.innerHTML = "";
            const list = MENU.filter(matches);

            if (list.length === 0) {
                const empty = document.createElement("p");
                empty.className = "menu-empty";
                empty.textContent = "Nothing in this category matches those filters. Try another tab or clear a filter.";
                grid.appendChild(empty);
            } else {
                list.forEach(function (d, i) {
                    grid.appendChild(buildDish(d, i));
                });
            }
            watchCounts(grid);

            count.textContent = list.length + (list.length === 1 ? " dish" : " dishes") + " in " + activeCategory;
        }

        function renderChips() {
            chipsBox.innerHTML = "";

            FILTERS.forEach(function (f) {
                const on = activeFilters.has(f.key);
                const button = document.createElement("button");
                button.type = "button";
                button.className = "chip-filter" + (on ? " on" : "");
                button.textContent = f.label;
                button.setAttribute("aria-pressed", String(on));

                button.addEventListener("click", function () {
                    if (activeFilters.has(f.key)) {
                        activeFilters.delete(f.key);
                    } else {
                        activeFilters.add(f.key);
                    }

                    renderChips();
                    chipsBox.children[FILTERS.indexOf(f)].classList.add("pop");
                    renderMenu();
                });

                chipsBox.appendChild(button);
            });
        }

        function renderTabs() {
            tabs.innerHTML = "";

            categories.forEach(function (cat) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "tab" + (cat === activeCategory ? " active" : "");
                button.textContent = cat;
                button.setAttribute("role", "tab");
                button.setAttribute("aria-selected", String(cat === activeCategory));

                button.addEventListener("click", function () {
                    activeCategory = cat;
                    renderTabs();
                    renderMenu();
                });

                tabs.appendChild(button);
            });
        }

        renderTabs();
        renderChips();
        renderMenu(); 
    </script>
</body>

</html>
